name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate notebooks and dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync

      - name: Validate notebook JSON integrity
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path

          errors = []
          notebooks = list(Path(".").rglob("*.ipynb"))
          for nb in notebooks:
              try:
                  with open(nb) as f:
                      data = json.load(f)
                  assert "cells" in data, "missing 'cells' key"
                  assert "metadata" in data, "missing 'metadata' key"
              except Exception as e:
                  errors.append(f"{nb}: {e}")

          if errors:
              print("Notebook validation errors:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print(f"All {len(notebooks)} notebook(s) are valid JSON.")
          EOF

      - name: Check Python syntax in notebook code cells
        run: |
          python - <<'EOF'
          import ast, json, sys
          from pathlib import Path

          errors = []
          for nb_path in Path(".").rglob("*.ipynb"):
              with open(nb_path) as f:
                  nb = json.load(f)
              for i, cell in enumerate(nb.get("cells", [])):
                  if cell.get("cell_type") != "code":
                      continue
                  src = "".join(cell.get("source", []))
                  # Skip IPython magic lines and shell commands
                  lines = [
                      ln for ln in src.splitlines()
                      if not ln.strip().startswith(("%", "!"))
                  ]
                  src_clean = "\n".join(lines)
                  try:
                      ast.parse(src_clean)
                  except SyntaxError as e:
                      errors.append(f"{nb_path} cell {i}: {e}")

          if errors:
              print("Syntax errors found:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print("All code cells passed syntax check.")
          EOF
